[project]
name = "luthor"
version = "0.2.0"
description = "System-1 query planner for any SQL database: dynamic bi-encoder fills a bounded plan, a compiler writes the SQL"
requires-python = ">=3.11"
dependencies = ["torch>=2.4", "transformers>=5.0", "peft", "sqlglot>=26", "numpy"]

[project.optional-dependencies]
mlx = ["mlx", "mlx-lm"]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luthor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
